version: "3.8"

services: 
  app:
    build: .
    image: image3:1
    container_name: nutrition-app
    ports:
      - "8182:8182"
    depends_on:
      - database
    restart: always
    environment:
      MONGO_URI: mongodb://database:27017

  database:
    image: mongo:7
    container_name: nutrition-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
