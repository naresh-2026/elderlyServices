apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-app
  labels:
    app: nutrition-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nutrition-app
  template:
    metadata:
      labels:
        app: nutrition-app
    spec:
      containers:
        - name: nutrition-app
          image: image3:1
          ports:
            - containerPort: 8182
          env:
            - name: MONGO_URI
              value: "mongodb://nutrition-mongo:27017"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8182
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8182
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-mongo
  labels:
    app: nutrition-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nutrition-mongo
  template:
    metadata:
      labels:
        app: nutrition-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi